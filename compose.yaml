# Optional: deploy this Compose file instead of configuring a Coolify Dockerfile app.
# Coolify manages the public domain and HTTPS; do not publish port 3000 on the host.
services:
  drive:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set your HTTPS origin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Generate credentials first}
      SESSION_SECRET: ${SESSION_SECRET:?Generate credentials first}
      STORAGE_PATH: /app/storage
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-20000000000}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-5000000000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1000000000}
      ASSISTANT_WORKER_URL: http://codex:4400
      ASSISTANT_WORKER_SECRET: ${ASSISTANT_WORKER_SECRET:?Generate a separate assistant worker secret}
    volumes:
      - /srv/file-storage:/app/storage
    stop_grace_period: 30s
  codex:
    build: ./services/codex
    restart: unless-stopped
    expose:
      - "4400"
    environment:
      ASSISTANT_WORKER_SECRET: ${ASSISTANT_WORKER_SECRET:?Generate a separate assistant worker secret}
      POCKET_DRIVE_URL: http://drive:3000
      CODEX_STATE_PATH: /state
    volumes:
      - /srv/pocket-drive-codex:/state
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
